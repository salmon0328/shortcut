<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shortcut</title>
  </head>
  <body>
    <main class="page">
      <header>
        <h1>Shortcut</h1>
        <p class="description">
          Find the quickest walking route between two points inside the Hive.
          Start typing where you are and where you want to go.
        </p>
      </header>

      <!-- A form, so pressing Enter works the same as clicking the button. -->
      <form id="route-form" class="card" autocomplete="off">
        <div class="field">
          <label for="origin-input">I am at…</label>
          <div class="combobox">
            <input
              type="text"
              id="origin-input"
              placeholder="Search for a place"
              role="combobox"
              aria-expanded="false"
              aria-controls="origin-suggestions"
              aria-autocomplete="list"
            />
            <ul id="origin-suggestions" class="suggestions" role="listbox" hidden></ul>
          </div>
        </div>

        <div class="field">
          <label for="destination-input">I need to get to…</label>
          <div class="combobox">
            <input
              type="text"
              id="destination-input"
              placeholder="Search for a place"
              role="combobox"
              aria-expanded="false"
              aria-controls="destination-suggestions"
              aria-autocomplete="list"
            />
            <ul
              id="destination-suggestions"
              class="suggestions"
              role="listbox"
              hidden
            ></ul>
          </div>
        </div>

        <fieldset class="options">
          <legend>Route preference</legend>

          <label class="choice">
            <input type="radio" name="preference" value="fastest" checked />
            <span>
              Fastest
              <small>Whichever is quicker, stairs or lift</small>
            </span>
          </label>

          <label class="choice">
            <input type="radio" name="preference" value="prefer_lift" />
            <span>
              Less climbing
              <small>Takes the lift where there is one</small>
            </span>
          </label>
        </fieldset>

        <fieldset class="options">
          <legend>Only use</legend>

          <label class="choice">
            <input type="checkbox" id="allow-stairs" checked />
            <span>Stairs allowed</span>
          </label>

          <label class="choice">
            <input type="checkbox" id="allow-lift" checked />
            <span>Lifts allowed</span>
          </label>

          <label class="choice">
            <input type="checkbox" id="sheltered-only" />
            <span>Sheltered corridors only</span>
          </label>
        </fieldset>

        <button type="submit" id="find-button">Find route</button>
      </form>

      <!-- Only one of these is ever visible at a time. -->
      <p id="loading" class="status loading" hidden>Finding the best route…</p>

      <p id="error" class="status error" hidden></p>

      <section id="result" class="card result" hidden>
        <h2 id="result-heading">Your route</h2>

        <dl class="totals">
          <div>
            <dt>Walking time</dt>
            <dd id="total-time">—</dd>
          </div>
          <div>
            <dt>Distance</dt>
            <dd id="total-distance">—</dd>
          </div>
        </dl>

        <ul class="badges">
          <li id="badge-stairs"></li>
          <li id="badge-lift"></li>
          <li id="badge-shelter"></li>
        </ul>

        <h3 id="steps-heading">Steps</h3>
        <p id="step-progress" class="step-progress"></p>
        <ol id="route-steps" class="steps"></ol>

        <div class="step-controls">
          <button type="button" id="back-button" class="secondary">Back</button>
          <button type="button" id="next-button">Next step</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
